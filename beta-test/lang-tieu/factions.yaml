Phe phái quan trọng:
  - |
    THIÊN MINH CÔNG ƯỚC:
    Liên minh tối thiểu tại Thiên Châu nhằm bảo vệ tiên mạch chung,
    Thiên Cực Đài và hạ tầng chống Tiên Khí Triều Tịch. Không phải
    chính quyền thống nhất. Nguồn lực gồm trận pháp chung, uy tín và
    cam kết tương trợ của các liên minh lớn. Điểm yếu là thiếu lòng tin.

  - |
    VẠN ĐẠO TIÊN MINH:
    Khối siêu cấp tông môn Chính đạo tại Trung Đạo Châu. Mục tiêu là
    giữ quyền kiểm soát mạng lưới truyền tống, linh mạch và trật tự
    chính trị. Nguồn lực gồm tu sĩ đông đảo, phàm quốc phụ thuộc và
    các huyết tộc có Nhân Tiên. Nội bộ chia rẽ giữa người giữ đạo nghĩa
    và phe thực dụng muốn chiếm tài nguyên Nam Viêm Châu.

  - |
    CỬU ĐỈNH THƯƠNG HỘI:
    Liên minh thương minh, Luyện Đan Sư và Luyện Khí Sư tại Nam Viêm
    Châu. Mục tiêu là bảo vệ tín dụng, thương lộ và độc lập kinh tế.
    Nguồn lực gồm kho đan dược, pháp bảo, tín phiếu, mạng lưới môi giới
    và lính đánh thuê. Điểm yếu là phụ thuộc nguyên liệu từ nhiều châu.

  - |
    ĐÔNG HOANG VẠN YÊU ĐÌNH:
    Liên minh lỏng lẻo của các Yêu Vương. Mục tiêu là giành lại linh
    mạch, hành lang di cư và lãnh địa sinh tồn. Nguồn lực là đàn thú,
    huyết mạch Thái Cổ và địa hình rừng sâu. Nội bộ không thống nhất
    về việc thương lượng hay tiếp tục thú triều.

  - |
    U MINH HUYẾT MINH:
    Liên minh bí mật của Ma Tôn, khế ước sư và tà tu tại U Minh Châu.
    Một bộ phận đang phát triển Tử Sĩ Phá Thệ. Nguồn lực gồm mạng lưới
    chợ đen, tử sĩ, huyết dược và khế ước thần hồn. Điểm yếu là nghiệp
    chướng nặng và sự phản bội nội bộ.

  - |
    TÂY SÁT KIẾM ƯỚC:
    Mạng lưới kiếm phái và đoàn lính đánh thuê tại Tây Sát Châu. Họ
    bảo vệ danh dự khế ước và kiếm thệ nhưng không có một lãnh tụ duy
    nhất. Nhiều đoàn đang được Nam Viêm Châu thuê, trong khi số khác
    nhận tiền từ Trung Đạo Châu.

  - |
    HUYẾT HẢI LIÊN CẢNG:
    Liên minh các cảng trung lập tại Huyết Hải Châu. Mục tiêu là giữ
    thương lộ và luật cấm giao chiến trong cảng. Nguồn lực gồm hạm đội,
    tiền thưởng truy nã và mạng lưới tình báo. Điểm yếu là các đảo chủ
    cùng hải tặc thường xuyên phá thỏa thuận.

  - |
    TY GIÁM THIÊN NGOẠI:
    Tổ chức liên châu chuyên điều tra Dị Số, biến động pháp tắc và vật
    ngoại lai. Mục tiêu công khai là bảo vệ Lăng Tiêu. Một số thành viên
    muốn nghiên cứu hoặc chiếm hữu cơ chế ngoại lai trước khi tiêu hủy.

Kẻ đối lập hoặc thực thể nguy hiểm:
  - "Dị Số chưa rõ danh tính đang can thiệp vào xác suất và tài nguyên."
  - "Kẻ sáng tạo tà pháp Tử Sĩ Phá Thệ."
  - "Những liên minh Nhân Tiên sẵn sàng phá Thiên Minh Công Ước."
  - "Các Yêu Vương cực đoan muốn dùng thú triều thay cho thương lượng."
  - "Những thế lực muốn chiếm Đại Truyền Tống Trận và mở chiến tranh liên châu."

Kế hoạch hiện tại:
  - "Vạn Đạo Tiên Minh gây áp lực lên các đầu mối truyền tống và tông môn phụ thuộc tại Nam Viêm Châu."
  - "Cửu Đỉnh Thương Hội đóng băng tín dụng, mua sạch nguyên liệu chiến lược và thuê lực lượng bảo vệ."
  - "Ty Giám Thiên Ngoại phong tỏa thông tin về dấu vết Dị Số."
  - "U Minh Huyết Minh tiếp tục thử nghiệm tà pháp trên các tử sĩ."
  - "Đông Hoang Vạn Yêu Đình tranh cãi về việc đóng hay mở rộng hành lang thú triều."
  - "Các liên minh Thiên Châu tích trữ Tiên Nguyên và thăm dò Chân Tiên Cơ Duyên."
